application:
  subdomain: channels-dvr-server
  background_task: true
  multi_instance: false
  gpu_accel: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://channels-dvr.cloud.lazycat.app.channels-dvr-server.lzcapp:8089/
services:
  channels-dvr:
    # upstream: fancybits/channels-dvr:latest@sha256:b153a5165e6cfcdb715dbeb6495b5c4492baf09b3fc6dd6a639701ef831c22fe
    image: docker.1ms.run/fancybits/channels-dvr:latest@sha256:b153a5165e6cfcdb715dbeb6495b5c4492baf09b3fc6dd6a639701ef831c22fe
    network_mode: host
    binds:
      - /lzcapp/var/channels-dvr:/channels-dvr
      - /lzcapp/var/DVR:/shares/DVR
