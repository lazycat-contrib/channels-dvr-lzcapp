application:
  subdomain: channels-dvr-server
  background_task: true
  multi_instance: false
  gpu_accel: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://channels-dvr.cloud.lazycat.app.channels-dvr-server.lzcapp:8089/

services:
  channels-dvr:
    # upstream: fancybits/channels-dvr:latest
    image: docker.1ms.run/fancybits/channels-dvr:latest@sha256:a50536a66ed46baf78b6eeab2aefc633c924c5fccb9b489d5307c9df80975c00
    network_mode: host
    binds:
      - /lzcapp/var/channels-dvr:/channels-dvr
      - /lzcapp/var/DVR:/shares/DVR
