version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/channels-dvr.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: channels-dvr
    bump: patch

build:
  run_buildscript: false

images:
  # 上游只有 latest 等可变 tag，无 immutable 家族：custom/created + digest-pin + patch 自增
  - id: channels-dvr
    target: service
    service: channels-dvr
    source: fancybits/channels-dvr
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Channels DVR Server
    summary: "一个灵活且独立的DVR服务器，让您随时随地安排和观看录制内容"
